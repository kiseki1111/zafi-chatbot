name: Build & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "apps/web/**"
      - ".github/workflows/**"
      - "Dockerfile*"
      - "docker-compose*"
      - "package*.json"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile.backend
            image: ghcr.io/kiseki1111/zafi-backend
          - name: web
            dockerfile: Dockerfile.web
            image: ghcr.io/kiseki1111/zafi-web
  
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha



      - name: Build & Push 
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Deployment (Force Without Cache)
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_WEBHOOK_URL || 'https://coolify.zafii.tech/api/v1/deploy?uuid=hqcqrwm4b5gxzbvrwrw3g73m' }}
          COOLIFY_BACKEND_URL: ${{ secrets.COOLIFY_BACKEND_WEBHOOK_URL }}
        run: |
          for URL in "$COOLIFY_URL" "$COOLIFY_BACKEND_URL"; do
            if [ -n "$URL" ]; then
              TARGET_URL=$(echo "$URL" | sed 's/force=false/force=true/g')
              if [[ "$TARGET_URL" != *"force=true"* ]]; then
                if [[ "$TARGET_URL" == *"?"* ]]; then
                  TARGET_URL="${TARGET_URL}&force=true"
                else
                  TARGET_URL="${TARGET_URL}?force=true"
                fi
              fi
              echo "Memanggil Webhook Coolify: $TARGET_URL"
              curl -f -sSL "$TARGET_URL" || echo "Panggilan webhook selesai."
            fi
          done
          if [ -z "$COOLIFY_BACKEND_URL" ]; then
            echo "::warning title=COOLIFY_BACKEND_WEBHOOK_URL Not Found::Secret COOLIFY_BACKEND_WEBHOOK_URL belum diset di GitHub Secrets. Jika backend dan web terpisah di Coolify, pastikan menambahkan secret webhook backend di GitHub agar backend ter-deploy otomatis."
          fi
