name: Build & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "apps/web/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile.backend
            image: ghcr.io/sisfoku/iqbal-backend
          - name: web
            dockerfile: Dockerfile.web
            image: ghcr.io/sisfoku/iqbal-web
  
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Debug Web Build (Log output)
        if: matrix.name == 'web'
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
          npm run build -w nextjs_tailwind_shadcn_ts

      - name: Build & Push 
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Komodo
        run: |
          curl -X POST "${{ secrets.KOMODO_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"secret\":\"${{ secrets.KOMODO_WEBHOOK_SECRET }}\"}"
