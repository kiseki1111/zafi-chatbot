name: Build & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "apps/web/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile.backend
            image: ghcr.io/kiseki1111/zafi-backend
          - name: web
            dockerfile: Dockerfile.web
            image: ghcr.io/kiseki1111/zafi-web
  
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha



      - name: Build & Push 
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ matrix.name == 'web' }}
          cache-from: ${{ matrix.name == 'web' && '' || 'type=gha' }}
          cache-to: ${{ matrix.name == 'web' && '' || 'type=gha,mode=max' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Webhook
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_WEBHOOK_URL || 'https://coolify.zafii.tech/api/v1/deploy?uuid=hqcqrwm4b5gxzbvrwrw3g73m&force=false' }}
          KOMODO_URL: ${{ secrets.KOMODO_WEBHOOK_URL }}
        run: |
          URL="${COOLIFY_URL:-$KOMODO_URL}"
          if [ -n "$URL" ]; then
            echo "Triggering deployment webhook..."
            curl -f -sSL "$URL"
          else
            echo "No deployment webhook URL configured, skipping."
          fi