name: Build and Deploy Web (Frontend)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'

jobs:
  build-and-push-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and Push Docker Image
        run: |
          docker build -f apps/web/Dockerfile -t ghcr.io/sisfoku/iqbal-web:latest .
          docker push ghcr.io/sisfoku/iqbal-web:latest

  deploy-to-komodo:
    needs: build-and-push-web
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Komodo Deploy Webhook
        run: |
          curl -X POST "${{ secrets.KOMODO_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d "{\"secret\":\"${{ secrets.KOMODO_WEBHOOK_SECRET }}\",\"event\":\"deploy\",\"source\":\"github-actions-web\"}"
