services:
  backend:
    image: ghcr.io/sisfoku/iqbal-backend:${IMAGE_TAG:-latest}
    container_name: iqbal-backend
    env_file:
      - .env
    restart: unless-stopped

    ports:
      - "3030:3030"

    dns:
      - 8.8.8.8
      - 8.8.4.4

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0

    networks:
      - backend

  web:
    image: ghcr.io/sisfoku/iqbal-web:${IMAGE_TAG:-latest}
    container_name: iqbal-web
    restart: unless-stopped

    depends_on:
      - backend

    environment:
      BACKEND_URL: http://backend:3030

    ports:
      - "3001:3001"

    networks:
      - backend

networks:
  backend:
    external: true