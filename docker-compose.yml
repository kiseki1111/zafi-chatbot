services:
  backend:
    image: ghcr.io/kiseki1111/zafi-backend:latest
    pull_policy: always
    container_name: iqbal-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PORT: 3030
      WAHA_API_URL: ${WAHA_API_URL:-http://waha:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY is required}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-${WAHA_API_KEY}}
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "3030:3030"
    networks:
      app-network:
        aliases:
          - backend

  web:
    image: ghcr.io/kiseki1111/zafi-web:latest
    pull_policy: always
    container_name: iqbal-web
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      PORT: 3001
      HOSTNAME: "0.0.0.0"
      BACKEND_URL: http://backend:3030
    ports:
      - "3001:3001"
    networks:
      - app-network

networks:
  app-network:
    name: coolify-network
    external: true
