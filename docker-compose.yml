services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: rbac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-secret_password}
      POSTGRES_DB: ${DATABASE_NAME:-rbac_api_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  waha:
    image: devlikeapro/waha:latest
    container_name: waha-core
    restart: unless-stopped
    environment:
      WHATSAPP_HOOK_URL: http://backend:3030/api/waha/webhook
    volumes:
      - waha_sessions:/.waha/sessions

  backend:
    image: ghcr.io/sisfoku/iqbal-backend:latest
    container_name: iqbal-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - waha
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-secret_password}@postgres:5432/${DATABASE_NAME:-rbac_api_db}?schema=public
      PORT: 3030
      NODE_TLS_REJECT_UNAUTHORIZED: 0
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "3030:3030"

  web:
    image: ghcr.io/sisfoku/iqbal-web:latest
    container_name: iqbal-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:3030
    ports:
      - "3001:3001"

volumes:
  postgres_data:
  waha_sessions: