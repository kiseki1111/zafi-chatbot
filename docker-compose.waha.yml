services:
  waha:
    image: devlikeapro/waha:chrome
    container_name: waha-core
    restart: unless-stopped
    environment:
      PORT: 3000
      WAHA_PORT: 3000
      WAHA_PRINT_QR: "false"
      WHATSAPP_HOOK_URL: http://backend:3030/api/v1/waha/webhook
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:?WHATSAPP_API_KEY is required}
      WHATSAPP_SWAGGER_USERNAME: ${WHATSAPP_SWAGGER_USERNAME:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WHATSAPP_SWAGGER_PASSWORD:?WHATSAPP_SWAGGER_PASSWORD is required}
      WAHA_WORKER_RESTART_ON_EXIT: "true"
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      WHATSAPP_START_SESSION: "zafi-cs"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - waha_sessions:/.waha/sessions
    networks:
      - app-network

volumes:
  waha_sessions:

networks:
  app-network:
    name: coolify-network
    external: true
